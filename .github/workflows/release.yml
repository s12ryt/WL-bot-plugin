name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. v1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag format
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Release tag must use vMAJOR.MINOR.PATCH.' >&2
            exit 1
          }
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify version matches tag
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          grep -Fx "version = \"$version\"" build.gradle.kts
          grep -Fx "version: '$version'" src/main/resources/plugin.yml
      - name: Run tests and build release JAR
        run: bash ./gradlew clean build --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
      - name: Generate checksum
        shell: bash
        run: |
          cd build/libs
          sha256sum ./*.jar > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build/libs/*.jar build/libs/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" build/libs/*.jar build/libs/SHA256SUMS.txt \
              --verify-tag --title "WLBotPlugin $RELEASE_TAG" --generate-notes
          fi
