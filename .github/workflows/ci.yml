name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Java 25 tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run tests and build plugin
        run: bash ./gradlew clean build --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v7
        with:
          name: WLBotPlugin
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  smoke-test:
    name: Smoke test on ${{ matrix.flavor }} 26.3
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        flavor: [paper, folia]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Download plugin JAR
        uses: actions/download-artifact@v7
        with:
          name: WLBotPlugin
          path: build/libs
      - name: Run end-to-end smoke test (real server + mock Telegram)
        run: >
          java --add-modules jdk.httpserver
          -cp build/libs/wl-bot-plugin-*.jar
          ci/SmokeTestDriver.java ${{ matrix.flavor }}
      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-${{ matrix.flavor }}
          path: |
            build/smoke/${{ matrix.flavor }}/run/logs/
            build/smoke/${{ matrix.flavor }}/mock-requests.jsonl
          if-no-files-found: warn
          retention-days: 14
